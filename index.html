<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de Metadatos de Imágenes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Lector de Metadatos de Imágenes</h1>
            <p class="subtitle">Sube una imagen para ver un informe completo de sus metadatos</p>
        </header>

        <section class="upload-section">
            <div id="dropZone" class="drop-zone">
                <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <p class="drop-text">Arrastra una imagen aquí o haz clic para seleccionar</p>
                <p class="drop-hint">Formatos soportados: JPG, JPEG, PNG, TIFF, HEIC, WEBP, GIF</p>
                <input type="file" id="fileInput" accept="image/*" hidden>
            </div>
        </section>

        <section id="resultsSection" class="results hidden">
            <div class="preview-card">
                <div class="preview-image-wrapper">
                    <img id="previewImage" src="" alt="Vista previa">
                </div>
                <div class="preview-info">
                    <h2 id="fileName"></h2>
                    <div id="basicInfo" class="basic-info"></div>
                    <button id="resetBtn" class="reset-btn">Cargar otra imagen</button>
                    <button id="exportBtn" class="export-btn">Exportar JSON</button>
                </div>
            </div>

            <div id="metadataReport" class="metadata-report"></div>
        </section>

        <div id="errorMsg" class="error-msg hidden"></div>

        <footer>
            <p>Procesado localmente en tu navegador. Ninguna imagen se sube a un servidor.</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
    <script src="script.js"></script>
</body>
</html>
